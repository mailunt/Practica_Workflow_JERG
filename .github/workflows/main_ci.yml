name: CI Pipeline Python

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar tu código
      uses: actions/checkout@v4

    - name: Preparar Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Instalar herramientas de prueba
      run: pip install pytest

    - name: Correr test_app.py
      run: pytest