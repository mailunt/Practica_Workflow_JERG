
name: Main CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build y Pruebas
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Verificar que el repositorio se descargó
      - name: Verificar repositorio
        run: |
          echo "Repositorio descargado correctamente"
          echo "Archivos encontrados:"
          ls -la

      # 3. Finalizar CI
      - name: Finalizar validación
        run: echo "CI ejecutado correctamente"
